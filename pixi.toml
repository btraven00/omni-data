[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["https://prefix.dev/almost-conductor", "conda-forge"]
name = "omni-data"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
check = "hapiq --help > /dev/null && echo OK"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/omni-data.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/omni-data.yml"

[dependencies]
hapiq = "*"
bash = "*"
